<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8" fill="#17647b"/></marker></defs><rect width="1100" height="600" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b36} .title{font-size:26px;font-weight:bold}.label{font-size:19px}.small{font-size:16px}.box{fill:#edf5f8;stroke:#17647b;stroke-width:2}.wire{fill:none;stroke:#17647b;stroke-width:3;marker-end:url(#arrow)}</style><text class="title" x="35" y="45">Bluetooth-to-infrared architecture</text><text class="small" x="35" y="75">2026 redrawing of the reported 2023 design; not new hardware evidence</text>
<rect class="box" x="35" y="170" width="180" height="120" rx="8"/><text class="label" x="55" y="210">Android app</text><text class="small" x="55" y="240">MIT App Inventor</text><text class="small" x="55" y="265">20 command buttons</text>
<rect class="box" x="295" y="170" width="160" height="120" rx="8"/><text class="label" x="320" y="210">HC-05</text><text class="small" x="310" y="240">Classic Bluetooth</text><text class="small" x="310" y="265">SPP to UART</text>
<rect class="box" x="535" y="170" width="180" height="120" rx="8"/><text class="label" x="550" y="210">Arduino Uno</text><text class="small" x="550" y="240">9600 baud / D0 RX</text><text class="small" x="550" y="265">Byte lookup / D3 IR</text>
<rect class="box" x="800" y="170" width="130" height="120" rx="8"/><text class="label" x="815" y="210">IR module</text><text class="small" x="815" y="240">RC6 frames</text><text class="small" x="815" y="265">Address 0x00</text>
<rect class="box" x="985" y="170" width="90" height="120" rx="8"/><text class="label" x="1008" y="230">TV</text>
<path class="wire" d="M215 230 H290"/><text class="small" x="227" y="155">SPP</text><path class="wire" d="M455 230 H530"/><text class="small" x="460" y="155">UART</text><path class="wire" d="M715 230 H795"/><text class="small" x="732" y="155">D3</text><path class="wire" d="M930 230 H980"/>
<rect class="box" x="535" y="385" width="370" height="90" rx="8"/><text class="label" x="555" y="420">Development verification only</text><text class="small" x="555" y="450">Separate receiver circuit + second Arduino</text><path class="wire" d="M865 290 V380"/><text class="small" x="925" y="350">Optical test</text>
<text class="small" x="35" y="525">External regulated 5 V power; shared ground for Uno, HC-05 breakout and IR module.</text><text class="small" x="35" y="553">HC-05 RX uses a 1 kOhm / 2 kOhm divider. USB and HC-05 share the Uno hardware UART.</text></svg>